<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080910">
  <title>OTP Verification UI Style</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>OTP Verification UI Style</h1>

    <section class="card" id="card" aria-labelledby="heading">
      <div class="icon-container" id="iconBox" aria-hidden="true">
        <svg class="status-icon lock-icon" viewBox="0 0 24 24" fill="none">
          <rect x="5" y="10" width="14" height="11" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="12" cy="15.5" r="1.2" fill="currentColor"/>
        </svg>
        <svg class="status-icon check-icon" viewBox="0 0 24 24" fill="none">
          <path d="m5 12.5 4.3 4.2L19.5 6.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h2 id="heading">Verification Code</h2>
      <p class="subtitle">Enter the 6-digit code (Demo: <strong>123456</strong>)</p>

      <form id="otpForm" novalidate>
        <div class="otp" id="otpContainer" aria-label="Six digit verification code">
          <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1" autofocus>
          <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 2">
          <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 3">
          <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 4">
          <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 5">
          <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 6">
        </div>

        <div class="progress" role="progressbar" aria-label="Code expiry time" aria-valuemin="0" aria-valuemax="60">
          <div class="fill" id="fill"></div>
        </div>

        <div class="meta">
          <div class="timer-wrapper">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span id="timer">01:00</span>
          </div>
          <button class="resend" id="resend" type="button" disabled>Resend Code</button>
        </div>

        <button class="verify" id="verify" type="submit">Verify Account</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </form>
    </section>
    <p class="demo-note">Demo verification code: <strong>123456</strong></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
